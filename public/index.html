<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fledgling Mission Manager</title>
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <link rel="stylesheet" href="style.css">

</head>

<body>
    <header class="app-header">
    <div class="brand-icon">✈</div>

    <div>
        <h1>Fledgling Mission Manager</h1>
        <p>Autonomous Drone Mission Planning</p>
    </div>

    <div class="system-status">
        <span class="status-dot"></span>
        System Online
    </div>
</header>

    <hr>

    <h2>Create Mission</h2>

    <form>
        <label for="missionName">Mission Name:</label>
        <input type="text" id="missionName" placeholder="Enter mission name">

        <br><br>

        <label for="latitude">Target Latitude:</label>
        <input type="number" id="latitude" step="any" placeholder="Enter latitude">

        <br><br>

        <label for="longitude">Target Longitude:</label>
        <input type="number" id="longitude" step="any" placeholder="Enter longitude">

        <br><br>

        <label for="altitude">Altitude (meters):</label>
        <input type="number" id="altitude" placeholder="Enter altitude">

        <br><br>

        <button type="submit">Create Mission</button>
    </form>

    <hr>

    <h2>Mission Status</h2>
<p id="missionStatus">No mission currently active.</p>

<h2>Mission Map</h2>

<div
    id="missionMap"
    style="height: 450px; width: 100%; margin-top: 15px;">
</div>

<hr>

<h2>Saved Missions</h2>

<div id="savedMissions">
    <p>No saved missions yet.</p>
</div>

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="missionPlanner.js"></script>
<script src="app.js"></script>
</body>
</html>
